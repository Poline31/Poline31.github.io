baseURL: "https://poline31.github.io/"
title: "Poline CTI"

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1

theme: PaperMod

pagination:
  pagerSize: 5

params:
  env: production
  defaultTheme: dark
  disableThemeToggle: false

  description: "Cyber Threat Intelligence, OSINT and Disinformation Analysis"
  author: "Poline CTI"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true

  # Hide reports from homepage
  mainSections:
    - posts

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/"

  homeInfoParams:
    Title: "Cyber Threat Intelligence"
    Content: |
      CTI Analyst focused on threat intelligence, OSINT and disinformation analysis.
      Researching threat actors, incidents and cyber influence operations.

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10

    - identifier: methodology
      name: Methodology
      url: /methodology/
      weight: 20

    - identifier: publications
      name: Publications
      url: /publications/
      weight: 30